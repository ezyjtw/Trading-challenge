environment: "challenge"  # development | testnet | challenge | funded

bybit:
  api_key: "${BYBIT_API_KEY}"
  api_secret: "${BYBIT_API_SECRET}"
  testnet: false  # true for paper trading on testnet

redis:
  addr: "redis:6379"
  password: ""
  use_tls: false

postgres:
  url: "postgres://trader:trader@postgres:5432/trading?sslmode=disable"

services:
  market_data:
    ws_url: "wss://stream.bybit.com/v5/public/linear"
    symbols:
      - "BTCUSDT"
      - "ETHUSDT"
    reconnect_backoff_ms: [1000, 2000, 5000, 10000]
    stale_data_threshold_ms: 3000

  funding_engine:
    pairs:
      - primary: "BTCUSDT"
        hedge: "ETHUSDT"
        min_correlation: 0.70
    min_annual_yield_pct: 5.0
    exit_threshold_diff_bps: 0.5
    negative_exit_cycles: 2
    max_allocation_pct: 60
    fee_bps_taker: 5.5
    eval_interval_s: 30
    intent_ttl_ms: 10000
    max_slippage_bps: 5.0
    cooldown_s: 300

  arb_engine:
    pairs:
      - primary: "BTCUSDT"
        hedge: "ETHUSDT"
        min_correlation: 0.70
    entry_std_dev: 2.0
    exit_std_dev: 0.5
    min_annualized_basis_pct: 15.0
    max_hold_days: 7
    max_allocation_pct: 25
    max_slippage_bps: 5.0
    cooldown_s: 600

  execution_router:
    max_retries_per_leg: 3
    hedge_drift_max_ms: 2000
    min_partial_fill_pct: 0.10
    recon_delay_ms: 2000
    recon_interval_ms: 60000
    fee_bps_taker: 5.5
    fee_bps_maker: 2.0

  risk_daemon:
    challenge_mode: true
    max_drawdown_pct: 10.0
    safe_mode_drawdown_pct: 7.0
    daily_soft_halt_pct: 3.0
    daily_hard_halt_pct: 4.0
    max_error_rate_5m_pct: 20.0
    max_hedge_drift_ms: 2000
    stale_data_pause_ms: 3000
    position_recon_interval_ms: 60000
    leg_mismatch_alert_ms: 60000
    leg_mismatch_close_ms: 120000
    kelly_fraction: 0.15

  capital_allocator:
    initial_capital_usd: 100000
    funding_max_pct: 60
    basis_max_pct: 25
    cash_reserve_pct: 12
    drawdown_scaling: true
    rebalance_interval_min: 30
    kelly_fraction: 0.15

  challenge_daemon:
    enabled: true
    config_path: "configs/challenge_config.yaml"
